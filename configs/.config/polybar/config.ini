[colors]
background = ${env:SETUP_BACKGROUND_COLOR:#282828}
background-alt = ${env:SETUP_BACKGROUND_ALT_COLOR:#32302F}
background-highlight = ${env:SETUP_BACKGROUND_HIGHLIGHT_COLOR:#3C3836}
background-muted = ${env:SETUP_BACKGROUND_MUTED_COLOR:#45403D}
border = ${env:SETUP_BACKGROUND_BORDER_COLOR:#5A524C}

foreground = ${env:SETUP_FOREGROUND_COLOR:#D4BE98}
foreground-alt = ${env:SETUP_FOREGROUND_ALT_COLOR:#DDC7A1}
muted = ${env:SETUP_FOREGROUND_MUTED_COLOR:#A89984}

red = ${env:SETUP_RED_COLOR:#EA6962}
orange = ${env:SETUP_ORANGE_COLOR:#E78A4E}
yellow = ${env:SETUP_YELLOW_COLOR:#D8A657}
green = ${env:SETUP_GREEN_COLOR:#A9B665}
aqua = ${env:SETUP_AQUA_COLOR:#89B482}
blue = ${env:SETUP_BLUE_COLOR:#7DAEA3}
purple = ${env:SETUP_PURPLE_COLOR:#D3869B}

focus = ${env:SETUP_FOCUS_COLOR:#A9B665}
urgent = ${env:SETUP_URGENT_COLOR:#EA6962}
warning = ${env:SETUP_WARNING_COLOR:#D8A657}
success = ${env:SETUP_SUCCESS_COLOR:#A9B665}
info = ${env:SETUP_INFO_COLOR:#7DAEA3}

[bar/main]
width = 98%
height = 34
offset-x = 1%
offset-y = 8
radius = 10
fixed-center = true

background = ${env:SETUP_BACKGROUND_COLOR:#282828}
foreground = ${env:SETUP_FOREGROUND_COLOR:#D4BE98}

border-size = 1
border-color = ${env:SETUP_BACKGROUND_BORDER_COLOR:#5A524C}

padding-left = 2
padding-right = 2
module-margin = 1

font-0 = "Noto Sans:size=10;2"
font-1 = "FontAwesome:size=10;2"

modules-left = bspwm title
modules-center = date
modules-right = cpu memory temperature filesystem network pulseaudio battery

wm-restack = bspwm
enable-ipc = true
screenchange-reload = true

; -------------------------
; BSPWM workspaces
; -------------------------
[module/bspwm]
type = internal/bspwm
pin-workspaces = true
enable-click = true
enable-scroll = true

label-focused = %name%
label-focused-background = ${env:SETUP_FOCUS_COLOR:#A9B665}
label-focused-foreground = ${env:SETUP_BACKGROUND_COLOR:#282828}
label-focused-padding = 2

label-occupied = %name%
label-occupied-foreground = ${env:SETUP_FOREGROUND_COLOR:#D4BE98}
label-occupied-padding = 2

label-empty = %name%
label-empty-foreground = ${env:SETUP_FOREGROUND_MUTED_COLOR:#A89984}
label-empty-padding = 2

label-urgent = %name%
label-urgent-background = ${env:SETUP_URGENT_COLOR:#EA6962}
label-urgent-foreground = ${env:SETUP_BACKGROUND_COLOR:#282828}
label-urgent-padding = 2

; -------------------------
; Window title
; -------------------------
[module/title]
type = internal/xwindow
label = %title%
label-maxlen = 40
label-foreground = ${env:SETUP_FOREGROUND_MUTED_COLOR:#A89984}
label-padding = 2

; -------------------------
; CPU
; -------------------------
[module/cpu]
type = internal/cpu
interval = 2

format = <label>
format-prefix = "CPU "
format-prefix-foreground = ${env:SETUP_BLUE_COLOR:#7DAEA3}

label = %percentage%%
label-foreground = ${env:SETUP_FOREGROUND_COLOR:#D4BE98}

; -------------------------
; RAM
; -------------------------
[module/memory]
type = internal/memory
interval = 3

format = <label>
format-prefix = "RAM "
format-prefix-foreground = ${env:SETUP_PURPLE_COLOR:#D3869B}

label = %percentage_used%%
label-foreground = ${env:SETUP_FOREGROUND_COLOR:#D4BE98}

; -------------------------
; Temperature
; -------------------------
[module/temperature]
type = internal/temperature
interval = 3
thermal-zone = 0
warn-temperature = 75

format = <label>
format-prefix = "TEMP "
format-prefix-foreground = ${env:SETUP_GREEN_COLOR:#A9B665}

format-warn = <label-warn>
format-warn-prefix = "TEMP "
format-warn-prefix-foreground = ${env:SETUP_RED_COLOR:#EA6962}

label = %temperature-c%
label-warn = %temperature-c%
label-warn-foreground = ${env:SETUP_RED_COLOR:#EA6962}

; -------------------------
; Filesystem
; -------------------------
[module/filesystem]
type = internal/fs
interval = 30
mount-0 = /

format-mounted = <label-mounted>
format-mounted-prefix = "DISK "
format-mounted-prefix-foreground = ${env:SETUP_ORANGE_COLOR:#E78A4E}

label-mounted = %percentage_used%%
label-mounted-foreground = ${env:SETUP_FOREGROUND_COLOR:#D4BE98}

; -------------------------
; Network
; -------------------------
[module/network]
type = internal/network
interface-type = wireless
interval = 3

format-connected = <label-connected>
format-connected-prefix = "WIFI "
format-connected-prefix-foreground = ${env:SETUP_AQUA_COLOR:#89B482}

label-connected = %essid%
label-connected-maxlen = 18

format-disconnected = <label-disconnected>
format-disconnected-prefix = "WIFI "
format-disconnected-prefix-foreground = ${env:SETUP_RED_COLOR:#EA6962}

label-disconnected = Offline

; -------------------------
; Audio
; -------------------------
[module/pulseaudio]
type = internal/pulseaudio

format-volume = <label-volume>
format-volume-prefix = "VOL "
format-volume-prefix-foreground = ${env:SETUP_YELLOW_COLOR:#D8A657}

label-volume = %percentage%%
label-volume-foreground = ${env:SETUP_FOREGROUND_COLOR:#D4BE98}

label-muted = MUTED
label-muted-foreground = ${env:SETUP_FOREGROUND_MUTED_COLOR:#A89984}

click-right = pavucontrol

; -------------------------
; Battery
; -------------------------
[module/battery]
type = internal/battery
battery = BAT1
adapter = ADP1
full-at = 98
poll-interval = 5

format-charging = <label-charging>
format-discharging = <label-discharging>
format-full = <label-full>

label-charging = BAT %percentage%%
label-charging-foreground = ${env:SETUP_GREEN_COLOR:#A9B665}

label-discharging = BAT %percentage%%
label-discharging-foreground = ${env:SETUP_FOREGROUND_COLOR:#D4BE98}

label-full = BAT Full
label-full-foreground = ${env:SETUP_GREEN_COLOR:#A9B665}

; -------------------------
; Date / Time
; -------------------------
[module/date]
type = internal/date
interval = 1

date = %a, %d %b
time = %H:%M

format = <label>
format-prefix = "TIME "
format-prefix-foreground = ${env:SETUP_YELLOW_COLOR:#D8A657}

label = %date%  %time%
label-foreground = ${env:SETUP_FOREGROUND_COLOR:#D4BE98}

[settings]
pseudo-transparency = true
