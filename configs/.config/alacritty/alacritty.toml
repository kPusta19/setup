# ==========================================================
# Alacritty - Gruvbox Material Dark Medium
# ==========================================================

[general]
live_config_reload = true
import = ["~/.config/alacritty/themes/current.toml"]

# ----------------------------------------------------------
# Window
# ----------------------------------------------------------

[window]
dimensions = { columns = 110, lines = 32 }
padding = { x = 14, y = 12 }
dynamic_padding = true

decorations = "None"
opacity = 0.90

startup_mode = "Windowed"
dynamic_title = true

# ----------------------------------------------------------
# Font
# ----------------------------------------------------------

[font]
size = 11.0
builtin_box_drawing = true

[font.normal]
family = "JetBrains Mono"
style = "Regular"

[font.bold]
family = "JetBrains Mono"
style = "Bold"

[font.italic]
family = "JetBrains Mono"
style = "Italic"

[font.bold_italic]
family = "JetBrains Mono"
style = "Bold Italic"

[font.offset]
x = 0
y = 0

[font.glyph_offset]
x = 0
y = 0

# ----------------------------------------------------------
# Cursor
# ----------------------------------------------------------

[cursor]
style = { shape = "Block", blinking = "On" }
blink_interval = 600
unfocused_hollow = true

# ----------------------------------------------------------
# Scrolling
# ----------------------------------------------------------

[scrolling]
history = 50000
multiplier = 3

# ----------------------------------------------------------
# Selection
# ----------------------------------------------------------

[selection]
save_to_clipboard = true

# ----------------------------------------------------------
# Mouse
# ----------------------------------------------------------

[mouse]
hide_when_typing = true

# ----------------------------------------------------------
# Debug
# ----------------------------------------------------------

[debug]
render_timer = false
persistent_logging = false
log_level = "Warn"