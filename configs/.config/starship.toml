
add_newline = false

format = """
$directory$git_branch$git_status$character"""

right_format = ""

[directory]
style = "fg:blue"
format = "[$path]($style) "
truncation_length = 2
truncation_symbol = "…/"
home_symbol = "~"
read_only = " 󰌾"

[git_branch]
symbol = " "
style = "fg:purple"
format = "[$symbol$branch]($style) "

[git_status]
style = "fg:orange"
format = "[$all_status$ahead_behind]($style) "
conflicted = "="
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕"
untracked = "?${count}"
modified = "!${count}"
staged = "+${count}"
renamed = "»"
deleted = "✘"

[character]
success_symbol = "[❯](fg:green)"
error_symbol = "[❯](fg:red)"
vimcmd_symbol = "[❮](fg:blue)"
format = "$symbol "